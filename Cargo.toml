[workspace]
members = [
    "crates/bunch-core",
    "crates/bunch-planner",
    "crates/bunch-protocol",
    "crates/bunch-native",
    "apps/cli",
    "apps/desktop",
]
default-members = ["apps/desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
async-channel = "=2.5.0"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
rfd = "=0.15.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

bunch-core = { path = "crates/bunch-core" }
bunch-native = { path = "crates/bunch-native" }
bunch-planner = { path = "crates/bunch-planner" }
bunch-protocol = { path = "crates/bunch-protocol" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"

